# openwebui — chat UI (open-webui, built from the upstream fork) + RAG pipelines.
# Polyrepo unit on the shared ai_network. (Transition bridge retired 2026-06-19;
# volume → openwebui_open_webui; env_file → ocr-service's real .env path.)
name: openwebui

networks:
  ai_network:
    external: true

volumes:
  open_webui:
    external: true
    name: openwebui_open_webui

services:
  open-webui:
    container_name: open-webui
    image: openwebui/open-webui:latest
    build:
      context: ..                       # custom/main repo root = the open-webui source
      dockerfile: deploy/Dockerfile
      args:
        BUILD_HASH: ${OWUI_VERSION:-dev} # set by deploy.sh to the checkout's short SHA
    volumes:
      - open_webui:/app/backend/data
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ENV: "prod"
      WEBUI_NAME: "ai.prokuratura.uz"
      ENABLE_OPENAI_API: true
      ENABLE_OLLAMA_API: false
      DEFAULT_LOCALE: "ru"
      DEFAULT_PROMPT_SUGGESTIONS: null
      ENABLE_WEB_LOADER_SSL_VERIFICATION: false
      # Docling OCR for scanned Cyrillic/Uzbek PDFs. This fork's DoclingLoader
      # only forwards DOCLING_PARAMS to docling-serve; the admin-panel OCR
      # engine/lang fields are ignored. Lang codes must match the tesseract
      # langpacks in docling.Dockerfile (rus, uzb, uzb_cyrl) — NOT "uzb_cyrlic".
      DOCLING_PARAMS: '{"ocr_engine":"tesseract","ocr_lang":["rus","uzb_cyrl","uzb"]}'
      ENABLE_CODE_EXECUTION: false
      ENABLE_CODE_INTERPRETER: false
      ENABLE_DIRECT_CONNECTIONS: false
      ENABLE_AUTOCOMPLETE_GENERATION: false
      ENABLE_EVALUATION_ARENA_MODELS: false
      # Thumbs up/down on answers (parity P2): feeds Open WebUI's own feedback
      # store, which scripts/pull_webui_feedback.py copies into qa_feedback for
      # the admin dashboard. Arena models stay off — we rate answers, not
      # model match-ups.
      ENABLE_MESSAGE_RATING: true
      ENABLE_COMMUNITY_SHARING: false
      # Finite session lifetime. Persistent config: the live value sits in
      # webui.db (auth.jwt_expiry) and wins over this env after first boot —
      # change it in Admin Settings > General, not just here. Was -1 (tokens
      # never expired) until 2026-08-14.
      JWT_EXPIRES_IN: 7d
      # Uzbek TTS via speech-uzbek-tts (172.18.35.124:8000), OpenAI-compatible.
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: ${TTS_ENDPOINT}
      AUDIO_TTS_OPENAI_API_KEY: ${UZBEK_TTS_TOKEN}
      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_VOICE: female
    networks:
      - ai_network
    restart: unless-stopped

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: always
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
    env_file:
      - .env
    environment:
      - LEX_UZ_RAG_URL=${RAG_BASE_URL}/lex_uz/stream
      - PROSECUTOR_RAG_URL=${RAG_BASE_URL}/prosecutor/stream
      - MINIMUM_BUILD=true
      - PIPELINES_REQUIREMENTS_PATH=/app/pipelines/requirements.txt
      - PIPELINES_API_KEY=${PIPELINES_API_KEY}
      # Parity P1: shared HMAC secret for signed identity headers the pipes
      # mint toward mcp-server (must equal MCP_AUTH_SECRET in legal-rag/.env).
      - MCP_AUTH_SECRET=${MCP_AUTH_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_network
